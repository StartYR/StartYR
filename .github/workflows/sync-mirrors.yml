name: Sync Repository Mirror

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows:
      - generate snake animation
      - Update profile stats
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: sync-repository-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to GitCode

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          GITCODE_SSH_PRIVATE_KEY: ${{ secrets.GITCODE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$GITCODE_SSH_PRIVATE_KEY" > ~/.ssh/gitcode
          chmod 600 ~/.ssh/gitcode

          ssh-keyscan gitcode.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host gitcode-mirror
            HostName gitcode.com
            User git
            IdentityFile ~/.ssh/gitcode
            IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repository.git

      - name: Sync to GitCode
        run: |
          set -euo pipefail

          cd repository.git
          git push --mirror git@gitcode-mirror:StartYi/StartYi.git